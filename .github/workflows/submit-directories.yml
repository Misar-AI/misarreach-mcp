name: Submit to Directories

# Reports what actually happened, which the previous version did not.
#
# Every job here used to end in `|| echo "..."` and exit 0, so the run was green
# whatever the far end said. Checked against a real run: mcpmarket answered 403,
# mcpserverhub answered 401, and both awesome-mcp-servers PR jobs died with
# "Resource not accessible by integration (createPullRequest)" — GITHUB_TOKEN
# cannot open a pull request against another repository. All four were reported
# as successful submissions. Nothing had ever been submitted anywhere.
#
# So this file now separates three different things and never conflates them:
#
#   LISTED      the server is verifiably present on that directory today
#   SUBMITTED   this run sent something the directory accepted (2xx)
#   MANUAL      the directory cannot be reached from CI — a human must do it,
#               and the summary says exactly where to go
#
# The run still succeeds when a directory needs manual action, because that is
# not a build failure. It fails only if a check that should work is broken.

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  PKG: "@misarreach/mcp"
  REPO: "https://github.com/Misar-AI/misarreach-mcp"
  SLUG: "misarreach-mcp"
  TITLE: "MisarReach MCP Server"

jobs:
  verify-listings:
    name: Verify where the server is already listed
    runs-on: ubuntu-latest
    steps:
      - name: Check every directory that can be read without an account
        run: |
          set -uo pipefail
          {
            echo "## Directory listing status"
            echo
            echo "| Directory | State | Detail |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # npm — the source of truth for the package itself
          NPM_V=$(curl -fsS "https://registry.npmjs.org/${PKG//\//%2F}/latest" | jq -r ".version // empty" || echo "")
          if [ -n "$NPM_V" ]; then
            echo "| npm | LISTED | \`${PKG}\` v${NPM_V} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| npm | **MISSING** | \`${PKG}\` not resolvable |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${PKG} is not on npm — every directory below reads from it."
            exit 1
          fi

          # The official registry is the one that publishes from CI, via OIDC in
          # publish.yml. Read it back rather than assuming that job worked.
          REG=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=${SLUG}" | jq -r --arg s "$SLUG" '[.servers[]?.server | select(.name | endswith($s))][0].version // empty' || echo "")
          if [ -n "$REG" ]; then
            echo "| MCP registry (official) | LISTED | v${REG} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| MCP registry (official) | **MISSING** | publish.yml should have registered it |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Presence checks by CONTENT, not status code. Smithery answers 200 for
          # a URL that cannot exist (verified against a nonsense slug), so a
          # status-only check reports every server as listed. Glama 404s
          # honestly. Each entry carries a string that only a real listing has.
          for entry in \
            "Smithery|https://smithery.ai/server/@Misar-AI/${SLUG}|${SLUG}" \
            "Glama|https://glama.ai/mcp/servers/Misar-AI/${SLUG}|${SLUG}" \
            "mcp.so|https://mcp.so/server/${SLUG}|${SLUG}"
          do
            NAME="${entry%%|*}"; REST="${entry#*|}"; URL="${REST%%|*}"; NEEDLE="${REST##*|}"
            PAGE=$(curl -s -L --max-time 25 -A "Mozilla/5.0" "$URL" || true)
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 25 -A "Mozilla/5.0" "$URL" || echo "000")
            if [ "$CODE" = "200" ] && printf '%s' "$PAGE" | grep -qi "$NEEDLE" \
               && ! printf '%s' "$PAGE" | grep -qiE "not found|does not exist|404"; then
              echo "| ${NAME} | LISTED | ${URL} |" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$CODE" = "403" ] || [ "$CODE" = "429" ]; then
              echo "| ${NAME} | MANUAL | bot-protected (${CODE}) — submit from a browser: ${URL} |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| ${NAME} | not listed | HTTP ${CODE}, no listing content — ${URL} |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  attempt-api-submissions:
    name: Attempt the directories that expose an API
    runs-on: ubuntu-latest
    steps:
      - name: POST where an endpoint exists, and say plainly when it refuses
        run: |
          set -uo pipefail
          {
            echo
            echo "## Submission attempts"
            echo
            echo "| Directory | HTTP | Outcome |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          attempt () {
            NAME="$1"; URL="$2"; BODY="$3"; MANUAL="$4"
            CODE=$(curl -s -o /tmp/resp -w "%{http_code}" --max-time 30 \
                     -X POST "$URL" -H "Content-Type: application/json" -d "$BODY" || echo "000")
            case "$CODE" in
              2*) echo "| ${NAME} | ${CODE} | SUBMITTED |" >> "$GITHUB_STEP_SUMMARY" ;;
              401|403) echo "| ${NAME} | ${CODE} | needs an account or is bot-protected — **do it here: ${MANUAL}** |" >> "$GITHUB_STEP_SUMMARY"
                       echo "::warning::${NAME} refused an automated submission (${CODE}). Submit manually: ${MANUAL}" ;;
              429) echo "| ${NAME} | 429 | rate-limited, try later — ${MANUAL} |" >> "$GITHUB_STEP_SUMMARY" ;;
              *)   echo "| ${NAME} | ${CODE} | no usable endpoint — **${MANUAL}** |" >> "$GITHUB_STEP_SUMMARY"
                   echo "::warning::${NAME} returned ${CODE}; submit manually at ${MANUAL}" ;;
            esac
          }

          attempt "mcpmarket.com" "https://mcpmarket.com/api/submit-url" \
                  "{\"url\":\"${REPO}\"}" "https://mcpmarket.com/submit"
          attempt "mcpserverhub.net" "https://mcpserverhub.net/api/submit" \
                  "{\"name\":\"${TITLE}\",\"url\":\"${REPO}\"}" "https://mcpserverhub.net/submit"

  manual-checklist:
    name: What still needs a human
    runs-on: ubuntu-latest
    needs: [verify-listings, attempt-api-submissions]
    if: always()
    steps:
      - name: Emit the checklist
        run: |
          {
            echo
            echo "## Needs a human"
            echo
            echo "These have no automatable path: they are behind bot protection, need"
            echo "an account, or want a pull request that GITHUB_TOKEN cannot open"
            echo "against a repository it does not own."
            echo
            echo "- PulseMCP — https://www.pulsemcp.com/submit"
            echo "- Glama — https://glama.ai/mcp/servers (indexes public repos; claim the listing)"
            echo "- mcp.so — https://mcp.so/submit"
            echo "- punkpeye/awesome-mcp-servers — PR #12443 open; Glama syncs from this list"
            echo
            echo "A fine-grained PAT with \`public_repo\` stored as \`DIRECTORY_PR_TOKEN\`"
            echo "would let the two awesome-list PRs be raised from CI; GITHUB_TOKEN"
            echo "cannot, and fails with \"Resource not accessible by integration\"."
          } >> "$GITHUB_STEP_SUMMARY"
