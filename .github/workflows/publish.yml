name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.0.2)'
        required: true
        type: string

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --ignore-scripts

      # --ignore-scripts above means dist/ is absent, so npm warns the bin file
      # does not exist and publishes a package whose entry point is missing.
      - name: Build
        run: npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # A re-run must not fail the whole pipeline. npm refuses to replace an
          # existing version, and this job gates the registry publish, so a
          # harmless retag was taking the downstream jobs down with it.
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${NAME}@${VERSION} is already on npm — nothing to publish."
          else
            npm publish --access public
          fi

  publish-smithery:
    name: Trigger Smithery re-scan
    runs-on: ubuntu-latest
    steps:
      - name: Probe MCP endpoint
        run: |
          curl -s -X POST https://api.misar.io/reach/mcp \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | jq -r '.result.tools | length | "Tools available: \(.)"' || echo "Probe sent (response may vary)"

  build-docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/misar-ai/misarreach-mcp:${{ steps.version.outputs.tag }}
            ghcr.io/misar-ai/misarreach-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-coolify:
    name: Trigger Coolify redeploy
    runs-on: ubuntu-latest
    needs: [publish-npm, build-docker]
    steps:
      - name: Redeploy via Coolify API
        run: |
          curl -s -X POST "$COOLIFY_DEPLOY_URL" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json" \
            | jq -r '.message // "Redeploy triggered"'
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}

  publish-registry:
    name: Publish to the official MCP registry
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The registry trusts a GitHub OIDC token to prove control of the
      # io.github.misar-ai namespace, so nothing long-lived is stored here.
      # This is also why the repo had to move into the org: the namespace and
      # the OIDC claim have to name the same owner.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
